<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Слова к паре по английскому</title>
<style>
:root{--bg:#fff;--fg:#222;--card:#f3f5f7;--bd:#d9dde2;--g:#58cc02;--gd:#46a302;--r:#ff4b4b;--b:#1cb0f6;--mut:#777;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131f24;--fg:#eee;--card:#1f2c33;--bd:#37464f;--mut:#9aa;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#131f24;--fg:#eee;--card:#1f2c33;--bd:#37464f;--mut:#9aa;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:520px;margin:0 auto;padding:16px;min-height:100vh;display:flex;flex-direction:column}
h1{font-size:24px;text-align:center;margin:8px 0 4px}
.sub{text-align:center;color:var(--mut);margin-bottom:16px}
.deck{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--bd);border-bottom-width:4px;border-radius:16px;padding:14px;margin:10px 0;color:var(--fg);font:inherit;cursor:pointer}
.deck b{font-size:19px}
.bar{height:10px;background:var(--bd);border-radius:6px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--g)}
.top{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.top .bar{flex:1;margin:0;height:14px}
.x{background:none;border:0;color:var(--mut);font-size:24px;cursor:pointer}
.q{font-size:22px;font-weight:700;margin:10px 0 6px}
.word{font-size:30px;font-weight:800;margin:6px 0 20px}
.opt{display:block;width:100%;text-align:left;padding:14px;margin:8px 0;border:2px solid var(--bd);border-bottom-width:4px;border-radius:14px;background:var(--bg);color:var(--fg);font:inherit;cursor:pointer}
.opt.ok{border-color:var(--g);background:rgba(88,204,2,.18)}
.opt.bad{border-color:var(--r);background:rgba(255,75,75,.18)}
input.t{width:100%;padding:14px;font:inherit;font-size:20px;border:2px solid var(--bd);border-radius:14px;background:var(--bg);color:var(--fg)}
.btn{display:block;width:100%;padding:14px;border:0;border-bottom:4px solid var(--gd);border-radius:14px;background:var(--g);color:#fff;font:inherit;font-weight:800;letter-spacing:.5px;cursor:pointer;margin-top:14px}
.btn:disabled{background:var(--bd);border-color:var(--bd);color:var(--mut)}
.fb{margin-top:auto;padding:14px;border-radius:14px;margin-bottom:6px}
.fb.ok{background:rgba(88,204,2,.2)}.fb.bad{background:rgba(255,75,75,.2)}
.big{text-align:center;font-size:56px;margin:30px 0 6px}
.stats{text-align:center;color:var(--mut)}
.mode{display:flex;gap:8px;justify-content:center;margin-bottom:6px}
.gap{font:700 26px/1.3 ui-monospace,Menlo,Consolas,monospace;letter-spacing:2px;margin:-8px 0 16px;word-break:break-word}.row{background:var(--card);border-radius:12px;padding:10px 12px;margin:8px 0}.row span{color:var(--mut);font-size:15px}.btn.sec{background:var(--card);color:var(--fg);border-color:var(--bd)}
</style></head><body><div id="app"></div>
<script>
const RAW={
app:["Внешность","curly|кудрявые;smooth|гладкие;straight/wavy|прямые/волнистые;red|рыжие;grey/white|седые;golden|золотистые;ash-blond|пепельные;silvery|серебристые;dark/fair|тёмные/светлые;brown/chestnut|каштановые;flat|приплюснутый;straight|прямой;bulbous nose|нос картошкой;to be snub-nosed|быть курносым;turned-up|вздёрнутый;round|круглое;long|длинное;to have a long face|иметь унылый вид;thin/chubby|худое/полнощёкое;pale|бледное;pretty/ugly|хорошенькое/уродливое;good-humoured|добродушное;plain|простое, обыкновенное;expressive|выразительное;freckles|веснушки;wrinkles|морщины;a beauty spot|родинка;a scar|шрам;a dimple|ямочка;moustache|усы;beard|борода;stubble|щетина;hazel|светло-коричневые;brown|карие;grey|серые;blue|голубые;almond|миндалевидные;intelligent|умные;mischievous|озорные;slanting|косые;regular/irregular|правильные/неправильные;plump|полная;slender|стройная;well-built|хорошо сложенная;skinny|худощавая"],
chr:["Характер","boring|скучный;bright|способный;gifted|одарённый;ambitious|амбициозный;brave|смелый;caring|заботливый;cheerful|весёлый;dreamy|мечтательный;generous|щедрый;grateful|благодарный;independent|независимый;cruel|жестокий;sensible|разумный;talkative|болтливый;shy|застенчивый;easy-going|добродушный;energetic|энергичный;frank|открытый;helpful|полезный;honest|честный;sincere|искренний;sociable|общительный;boastful|хвастливый;careless|небрежный;greedy|жадный;insensitive|бесчувственный;intolerant|нетерпимый;jealous|ревнивый;moody|человек настроения;rude|грубый;selfish|эгоистичный;stubborn|упрямый;stupid|глупый;unreliable|ненадёжный;envious|завистливый"],
job:["Профессии","doctor|врач;shop assistant|продавец;nurse|медсестра;teacher|учитель;pilot|пилот;travel agent|турагент;economist|экономист;lawyer|юрист;postman|почтальон;programmer|программист;dancer|танцор;cook|повар;housewife|домохозяйка;secretary|секретарь;barman|бармен;guard|охранник;dentist|стоматолог;fireman|пожарный;engineer|инженер;translator|переводчик;accountant|бухгалтер;architect|архитектор;agriculturist|агроном;judge|судья;scientist|учёный;vet|ветеринар;driver|водитель;police officer|полицейский;singer|певец;painter|художник;porter|швейцар;worker|рабочий;builder|строитель;journalist|журналист;surgeon|хирург;military man|военный"]};
const D={};for(const k in RAW)D[k]={name:RAW[k][0],w:RAW[k][1].split(";").map(s=>{const[a,b]=s.split("|");return{en:a,ru:b,k}})};
for(const k in D){const out=[];for(const w of D[k].w){const a=w.en.split("/"),b=w.ru.split("/");if(a.length>1&&a.length==b.length)a.forEach((x,i)=>out.push({en:x,ru:x=="straight"?"прямые (волосы)":b[i],k}));else out.push(w)}D[k].w=out}
D.app.w.push({en:"chestnut",ru:"каштановые (волосы)",k:"app"},{en:"snub-nosed",ru:"курносый (нос)",k:"app",alt:["turned-up","turned-up nose","turned up nose","snub-nose","snub nose"]});
const ovRu={wavy:"волнистые (волосы)",dark:"тёмные (волосы)",fair:"светлые (волосы)",selfish:"жадный/эгоистичный"};
for(const k in D)D[k].w.forEach(w=>{if(ovRu[w.en])w.ru=ovRu[w.en]});
const ALL=Object.values(D).flatMap(d=>d.w);
let P={},stOK=true;try{P=JSON.parse(localStorage.getItem("wg2")||"{}");localStorage.setItem("wg2",JSON.stringify(P))}catch(e){stOK=false}
const save=()=>{try{localStorage.setItem("wg2",JSON.stringify(P))}catch(e){stOK=false}};
const kk=w=>w.en+"|"+w.ru, sc=w=>P[kk(w)]||0;
const sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const $=document.getElementById("app");
const ART=w=>w.k=="job"?(/^[aeiou]/i.test(w.en)?"an ":"a ")+w.en:w.en;
const nE=s=>s.toLowerCase().replace(/[’'`]/g,"").replace(/[-–]/g," ").replace(/gray/g,"grey").replace(/humored/g,"humoured").replace(/mustache/g,"moustache").replace(/\s+/g," ").trim().replace(/^(a|an|to|the)\s+/,"");
const nR=s=>s.toLowerCase().replace(/ё/g,"е").replace(/\(.*?\)/g,"").replace(/\s+/g," ").trim();
const enP=w=>[w.en,...w.en.split("/"),...(w.alt||[])].map(nE);
const ruP=w=>[...new Set([nR(w.ru),...w.ru.split(/[\/,]/).map(nR)])].filter(Boolean);
function lev(a,b){const d=[];for(let i=0;i<=a.length;i++)d[i]=[i];for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]==b[j-1]?0:1));return d[a.length][b.length]}
const okEn=(t,w)=>{t=nE(t);return !!t&&enP(w).includes(t)};
const okRu=(t,w)=>{t=nR(t);return !!t&&ruP(w).some(p=>p==t||(p.length>=6&&lev(p,t)<=1))};
const same=(a,b)=>ruP(a).some(p=>ruP(b).includes(p));
const gapOk=w=>!w.en.includes("/")&&!/^to /.test(w.en)&&w.en.replace(/[^a-z]/gi,"").length>=5;
function gapOf(w){const s=w.en,idx=[];for(let i=1;i<s.length;i++)if(/[a-z]/i.test(s[i]))idx.push(i);
  const n=Math.max(1,Math.min(3,Math.round(idx.length/4))),p=new Set(sh(idx).slice(0,n));
  return [...s].map((c,i)=>c==" "?"\u00a0":(p.has(i)?"_":c)).join(" ")}
function mode(w){const s=sc(w);const m=s<1?["en2ru","ru2en"]:s<3?["ru2en","en2ruT","gap","type"]:["type","en2ruT","gap","type"];
  const r=m[Math.floor(Math.random()*m.length)];return r=="gap"&&!gapOk(w)?"type":r}
let pool=ALL,q=[],total=1,done=0,xp=0,cur,locked,lastK="all",T,wrongW=[];

function menu(){xp=0;
  const row=(k,name,ws)=>{const m=ws.filter(w=>sc(w)>=3).length;
    const pct=(ws.reduce((a,w)=>a+Math.min(sc(w),3),0)/(ws.length*3)*100).toFixed(1);
    return `<button class="deck" onclick="start('${k}')"><b>${name}</b><div style="color:var(--mut)">выучено ${m} из ${ws.length}</div><div class="bar"><i style="width:${pct}%"></i></div></button>`};
  $.innerHTML=`<h1>📚 Слова к паре</h1><div class="sub">Чем лучше знаешь слово, тем ближе задания к зачёту: сначала выбор, потом письменно.</div>
  ${stOK?"":`<div class="sub" style="color:var(--r)">⚠️ Браузер не даёт сохранить прогресс: после закрытия страницы он обнулится.</div>`}
  <button class="deck" style="border-color:var(--b)" onclick="startTest()"><b>📝 Пробный зачёт</b><div style="color:var(--mut)">30 заданий как на настоящем: перевод на русский, на английский, пропущенные буквы</div></button>`+
  Object.keys(D).map(k=>row(k,D[k].name,D[k].w)).join("")+row("all","Всё вместе",ALL);
}
function begin(ws){q=sh(ws).map(w=>({w,m:mode(w)}));total=q.length;done=0;next()}
function start(k){lastK=k;pool=k=="all"?ALL:D[k].w;begin(sh(pool).sort((a,b)=>sc(a)-sc(b)).slice(0,10))}
function retry(){lastK="all";pool=ALL;begin(wrongW.slice(0,15))}
function hdr(){return `<div class="top"><button class="x" onclick="menu()">✕</button><div class="bar"><i style="width:${done/total*100}%"></i></div><b>⭐ ${xp}</b></div>`}
function next(){
  if(!q.length)return end();
  cur=q[0];locked=false;const{w,m}=cur;
  if(m=="en2ru"||m=="ru2en"){
    const f=m=="en2ru"?"ru":"en";
    const o=sh([w,...sh(pool.filter(x=>x.en!=w.en&&!same(x,w))).slice(0,3)]);cur.ci=o.indexOf(w);
    $.innerHTML=hdr()+`<div class="q">${m=="en2ru"?"Переведи на русский":"Выбери английское слово"}</div><div class="word">${esc(m=="en2ru"?ART(w):w.ru)}</div>`+o.map(()=>`<button class="opt"></button>`).join("")+`<div id="fb"></div>`;
    [...document.querySelectorAll(".opt")].forEach((b,i)=>{b.textContent=f=="ru"?o[i].ru:ART(o[i]);b.onclick=()=>choose(b,i==cur.ci)});
  }else{
    const lab={en2ruT:"Напиши перевод по-русски",type:"Напиши по-английски",gap:"Впиши слово целиком"}[m];
    if(m=="gap")cur.g=gapOf(w);
    $.innerHTML=hdr()+`<div class="q">${lab}</div><div class="word">${esc(m=="en2ruT"?ART(w):w.ru)}</div>${m=="gap"?`<div class="gap">${cur.g}</div>`:""}<input class="t" id="in" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"><button class="btn" id="ch" onclick="checkT()">ПРОВЕРИТЬ</button><div id="fb"></div>`;
    const i=document.getElementById("in");i.focus();i.onkeydown=e=>{if(e.key=="Enter")checkT()};
  }
}
function checkT(){if(locked)return next();const i=document.getElementById("in");if(!i.value.trim())return;i.disabled=true;result((cur.m=="en2ruT"?okRu:okEn)(i.value,cur.w))}
function choose(b,ok){if(locked)return;[...document.querySelectorAll(".opt")].forEach((x,i)=>{x.disabled=true;if(i==cur.ci)x.classList.add("ok")});if(!ok)b.classList.add("bad");result(ok)}
function result(ok){
  locked=true;const w=cur.w,typed=["type","en2ruT","gap"].includes(cur.m);
  if(ok){P[kk(w)]=sc(w)+(typed?1:.5);xp+=typed?15:10;done++;q.shift()}
  else{P[kk(w)]=Math.max(0,sc(w)-1);q.shift();q.push({w,m:mode(w)})}
  save();
  document.getElementById("fb").innerHTML=`<div class="fb ${ok?"ok":"bad"}"><b>${ok?"Верно! 🎉":"Правильно:"}</b> ${esc(ART(w))} — ${esc(w.ru)}</div>`;
  const c=document.getElementById("ch");
  if(c)c.textContent="ДАЛЬШЕ";else document.getElementById("fb").innerHTML+=`<button class="btn" onclick="next()">ДАЛЬШЕ</button>`;
}
function end(){
  $.innerHTML=`<div class="big">🏆</div><h1>Отлично!</h1><div class="stats">⭐ ${xp} XP</div><button class="btn" onclick="start(lastK)">ЕЩЁ УРОК</button><button class="btn sec" onclick="startTest()">ПРОБНЫЙ ЗАЧЁТ</button><button class="btn sec" onclick="menu()">В МЕНЮ</button>`;
}
const SEC=["Переведи на русский","Переведи на английский","Вставь пропущенные буквы"];
function startTest(){
  const gaps=sh(ALL.filter(gapOk)).slice(0,10),rest=sh(ALL.filter(w=>!gaps.includes(w)));
  T={i:0,ans:[],items:[...rest.slice(0,10).map(w=>({w,m:"en2ruT"})),...rest.slice(10,20).map(w=>({w,m:"type"})),...gaps.map(w=>({w,m:"gap"}))]};tNext();
}
function tNext(){
  if(T.i>=30)return tEnd();
  const it=T.items[T.i],w=it.w;if(it.m=="gap")it.g=gapOf(w);
  $.innerHTML=`<div class="top"><button class="x" onclick="menu()">✕</button><div class="bar"><i style="width:${T.i/30*100}%"></i></div><b>${T.i+1}/30</b></div><div class="q">${SEC[Math.floor(T.i/10)]}</div><div class="word">${esc(it.m=="en2ruT"?ART(w):w.ru)}</div>${it.m=="gap"?`<div class="gap">${it.g}</div>`:""}<input class="t" id="in" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"><button class="btn" onclick="tSub()">ДАЛЬШЕ</button>`;
  const i=document.getElementById("in");i.focus();i.onkeydown=e=>{if(e.key=="Enter")tSub()};
}
function tSub(){T.ans.push(document.getElementById("in").value);T.i++;tNext()}
function tEnd(){
  const res=T.items.map((it,i)=>({w:it.w,a:T.ans[i],ok:(it.m=="en2ruT"?okRu:okEn)(T.ans[i],it.w)}));
  const s=[0,1,2].map(n=>res.slice(n*10,n*10+10).filter(r=>r.ok).length),tot=s[0]+s[1]+s[2];
  res.forEach(r=>{P[kk(r.w)]=r.ok?sc(r.w)+1:Math.max(0,sc(r.w)-1)});save();
  const bad=res.filter(r=>!r.ok);wrongW=bad.map(r=>r.w);
  $.innerHTML=`<div class="big">${tot>=26?"🏆":tot>=20?"👍":"💪"}</div><h1>${tot} / 30</h1><div class="stats">RU: ${s[0]}/10 · EN: ${s[1]}/10 · буквы: ${s[2]}/10</div>`+
   (bad.length?`<div class="q" style="margin-top:16px">Ошибки</div>`+bad.map(r=>`<div class="row">${esc(ART(r.w))} — ${esc(r.w.ru)}<br><span>твой ответ: ${esc(r.a.trim()||"—")}</span></div>`).join(""):"")+
   (bad.length?`<button class="btn" onclick="retry()">ПОВТОРИТЬ ОШИБКИ</button>`:"")+`<button class="btn sec" onclick="startTest()">НОВЫЙ ЗАЧЁТ</button><button class="btn sec" onclick="menu()">В МЕНЮ</button>`;
}
menu();
</script></body></html>
